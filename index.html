<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portabooth</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Portabooth</h1>
    <p>four frames, one strip, all yours</p>
  </header>

  <p class="template-note" id="templateNote" style="display:none;">Using a shared custom template</p>

  <audio id="bgMusic" src="sounds/lofi-loop.mp3" loop preload="auto"></audio>
  <button id="musicToggle" class="ghost" type="button" style="display:none;">🎵 Music: off</button>

  <details class="customize" id="customize" open>
    <summary>Customize your strip</summary>

    <div class="field">
      <label for="siteThemeSelect">Site theme</label>
      <select id="siteThemeSelect">
        <option value="classic">Classic</option>
        <option value="noir">Noir</option>
        <option value="blush">Blush</option>
        <option value="mint">Mint</option>
      </select>
    </div>

    <div class="field">
      <label for="captionInput">Caption</label>
      <input type="text" id="captionInput" maxlength="40" value="Portabooth">
    </div>

    <div class="style-toggle-row">
      <label><input type="checkbox" id="boldInput"> Bold</label>
      <label><input type="checkbox" id="italicInput"> Italic</label>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="showDateInput" checked>
      Show date on strip
    </label>

    <div class="field">
      <label>Preview</label>
      <div class="caption-preview-frame">
        <canvas id="captionPreview"></canvas>
      </div>
    </div>

    <button id="getLinkBtn" type="button">Get shareable link</button>

    <div class="share-output" id="shareOutput">
      <div class="link-row">
        <input type="text" id="shareLink" readonly>
        <button id="copyLinkBtn" class="ghost" type="button">Copy</button>
      </div>
      <div id="qrOutput"></div>
    </div>
  </details>

  <div class="stage" id="stage">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <button id="flipCameraBtn" class="flip-camera-btn" type="button" title="Switch camera" style="display:none;">🔄</button>
      <div class="flash" id="flash"></div>
      <div class="countdown-overlay" id="countdown"></div>
      <div class="shot-counter" id="shotCounter">0 / 4</div>
    </div>
    <div class="controls">
      <button id="startBtn">Take Photostrip</button>
      <button id="retakeBtn" class="ghost" style="display:none;">Start over</button>
    </div>
  </div>

  <p class="hint" id="permHint">Tap "Take Photostrip" and allow camera access. Everything happens on your device — nothing is uploaded anywhere.</p>

  <div class="strip-wrap" id="stripWrap">
    <div class="strip-carousel-row">
      <button id="framePrevBtn" class="frame-arrow-btn" aria-label="Previous frame">‹</button>
      <div class="strip-scroller" id="stripScroller"></div>
      <button id="frameNextBtn" class="frame-arrow-btn" aria-label="Next frame">›</button>
    </div>
    <p class="frame-name" id="frameName">Classic</p>
    <div class="field-row">
      <div class="field" id="dateStyleField">
        <label for="dateStyleSelect">Date style</label>
        <select id="dateStyleSelect">
          <option value="long">Sep 14, 2026</option>
          <option value="numeric">9.14.26</option>
          <option value="off">No date</option>
        </select>
      </div>
      <div class="field">
        <label for="filterSelect">Filter</label>
        <select id="filterSelect">
          <option value="default">Default</option>
          <option value="bw">Black & White</option>
          <option value="sepia">Sepia</option>
          <option value="saturated">Saturated</option>
        </select>
      </div>
    </div>
    <div class="save-row">
      <button id="saveBtn">Save to device</button>
      <button id="shareBtn" class="ghost" style="display:none;">Share</button>
      <button id="printBtn" class="ghost">Print</button>
      <button id="againBtn" class="ghost">New strip</button>
    </div>
  </div>

  <canvas id="workCanvas" style="display:none;"></canvas>
  <div class="print-sheet" id="printSheet"></div>

<script src="qrcode.min.js"></script>
<script>
const video = document.getElementById('video');
const flipCameraBtn = document.getElementById('flipCameraBtn');
const startBtn = document.getElementById('startBtn');
const retakeBtn = document.getElementById('retakeBtn');
const countdownEl = document.getElementById('countdown');
const flashEl = document.getElementById('flash');
const shotCounter = document.getElementById('shotCounter');
const stage = document.getElementById('stage');
const stripWrap = document.getElementById('stripWrap');
const workCanvas = document.getElementById('workCanvas');
const permHint = document.getElementById('permHint');
const saveBtn = document.getElementById('saveBtn');
const shareBtn = document.getElementById('shareBtn');
const printBtn = document.getElementById('printBtn');
const printSheet = document.getElementById('printSheet');
const againBtn = document.getElementById('againBtn');

const siteThemeSelect = document.getElementById('siteThemeSelect');
const captionInput = document.getElementById('captionInput');
const boldInput = document.getElementById('boldInput');
const italicInput = document.getElementById('italicInput');
const showDateInput = document.getElementById('showDateInput');
const getLinkBtn = document.getElementById('getLinkBtn');
const shareOutput = document.getElementById('shareOutput');
const shareLinkInput = document.getElementById('shareLink');
const copyLinkBtn = document.getElementById('copyLinkBtn');
const qrOutput = document.getElementById('qrOutput');
const templateNote = document.getElementById('templateNote');
const customizeDetails = document.getElementById('customize');
const bgMusic = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');
const captionPreview = document.getElementById('captionPreview');
const dateStyleField = document.getElementById('dateStyleField');
const dateStyleSelect = document.getElementById('dateStyleSelect');
const filterSelect = document.getElementById('filterSelect');
const framePrevBtn = document.getElementById('framePrevBtn');
const frameNextBtn = document.getElementById('frameNextBtn');
const frameNameEl = document.getElementById('frameName');
const stripScroller = document.getElementById('stripScroller');

const SHOT_COUNT = 4;
const FRAME_W = 500;   // px per photo cell at capture resolution
const FRAME_H = 375;   // 4:3
const PADDING = 30;
const GAP = 14;
// Each photo is drawn at this fraction of its cell (both dimensions scaled
// equally, so the diagonal shrinks by the same percentage), centered within
// it — see drawStripContent().
const PHOTO_SCALE = 0.99;

// Extra margins between the dashed border and the two-strip block on the
// print formatting ONLY (buildPrintCanvas()) — distinct from PADDING, which
// governs spacing within each individual strip and is untouched by these.
// Measured as the literal gap from each dashed line to the two-strip
// block's own edge in that direction.
const PRINT_TOP_MARGIN = 40;
const PRINT_SIDE_MARGIN = 20;    // outer left/right only, not the middle divider
const PRINT_BOTTOM_MARGIN = 40;  // below the caption/date area

// Print-only fine-tune: nudges each strip's content (paper + photos +
// caption) this many px toward its own outer edge — left strip shifts left,
// right strip shifts right — away from the shared middle cut line. Purely a
// manual visual adjustment on top of the equal-margins layout below; doesn't
// move the dashed cut line itself, and has no effect on renderAllFrames()/
// the on-screen preview.
const PRINT_OUTWARD_NUDGE = -2.5;

// The strip itself always prints on plain white paper with dark ink, regardless
// of the site theme — only the surrounding website chrome follows the theme.
const STRIP_PAPER = '#ffffff';
const STRIP_INK = '#241412';
const CAPTION_FONT_SIZE = 32;
const DATE_FONT_SIZE = 22;
const CAPTION_LINE_GAP = 10;
const CAPTION_PAD = 18; // top/bottom padding around the caption block

// Site theme = the website's own color scheme (curtain/bulb/brass/etc). It no
// longer affects the exported photo strip, which always stays white/dark ink.
const SITE_THEMES = ['classic', 'noir', 'blush', 'mint'];

let stream = null;
let facingMode = 'user';
let shots = [];
let config = { siteTheme: 'classic', caption: 'Portabooth', bold: false, italic: false, showDate: true };

// Date format is deliberately NOT part of the shared config — unlike the
// caption, it stays a free choice for whoever is using the page right now
// (including someone who opened a shared link), available once a strip exists.
let dateStyle = 'long';

// Photo filter — same treatment as dateStyle: a free post-capture choice,
// not part of the shared config/URL.
//
// Applied via direct pixel math (getImageData/putImageData), NOT the canvas
// 2D context's `filter` property (ctx.filter = 'grayscale(100%)' etc.).
// ctx.filter support is inconsistent across mobile browsers (notably older
// iOS Safari) — where unsupported, setting it silently does nothing at all,
// no error, so filters would just appear not to work. The matrices below are
// exactly what the CSS Filter Effects spec defines for grayscale/sepia/
// saturate, applied by hand per-pixel, which works identically everywhere.
let photoFilter = 'default';

function grayscaleMatrix() {
  return [0.2126, 0.7152, 0.0722, 0.2126, 0.7152, 0.0722, 0.2126, 0.7152, 0.0722];
}
function sepiaMatrix(amount) {
  const i = 1 - amount;
  return [
    0.393 + 0.607 * i, 0.769 - 0.769 * i, 0.189 - 0.189 * i,
    0.349 - 0.349 * i, 0.686 + 0.314 * i, 0.168 - 0.168 * i,
    0.272 - 0.272 * i, 0.534 - 0.534 * i, 0.131 + 0.869 * i,
  ];
}
function saturateMatrix(s) {
  return [
    0.213 + 0.787 * s, 0.715 - 0.715 * s, 0.072 - 0.072 * s,
    0.213 - 0.213 * s, 0.715 + 0.285 * s, 0.072 - 0.072 * s,
    0.213 - 0.213 * s, 0.715 - 0.715 * s, 0.072 + 0.928 * s,
  ];
}

// Amounts here mirror the CSS filter() percentages this replaced: grayscale
// 100%, sepia 75%, saturate 150%.
const FILTER_MATRICES = {
  default: null,
  bw: grayscaleMatrix(),
  sepia: sepiaMatrix(0.75),
  saturated: saturateMatrix(1.5),
};

function applyPixelFilterMatrix(ctx, x, y, w, h, matrix) {
  if (!matrix) return;
  const imageData = ctx.getImageData(x, y, w, h);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    data[i] = Math.min(255, Math.max(0, r * matrix[0] + g * matrix[1] + b * matrix[2]));
    data[i + 1] = Math.min(255, Math.max(0, r * matrix[3] + g * matrix[4] + b * matrix[5]));
    data[i + 2] = Math.min(255, Math.max(0, r * matrix[6] + g * matrix[7] + b * matrix[8]));
  }
  ctx.putImageData(imageData, x, y);
}

// Themed frame overlays — a transparent PNG (same 560x[captionH-dependent]
// layout as a single strip: see ARCHITECTURE.md "Themed frames") drawn on
// top of drawStripContent()'s photos/caption, per strip. Browsed via a
// swipeable carousel (see "Frame carousel" below) — an ordered array, not a
// keyed object, so "next"/"previous"/scroll-nearest is just an index into
// it. `classic` (index 0, the default) has `src: null` and draws nothing,
// leaving today's plain-strip look unchanged. Free, per-viewer choice like
// photoFilter/dateStyle above — not part of the shared/lockable `config`.
const FRAMES = [
  { key: 'classic', label: 'Classic', src: null },
  { key: 'engagement-blue', label: 'Engagement (Blue)', src: 'frames/engagement.png' },
  { key: 'engagement-beige', label: 'Engagement (Beige)', src: 'frames/engagement-beige.png' },
  { key: 'engagement-yellow', label: 'Engagement (Yellow)', src: 'frames/engagement-yellow.png' },
];
let frameIndex = 0;

// Cached by src so repeated renderAllFrames() calls (every filter/date
// change re-renders every slide) don't re-fetch each frame image each time.
const frameImageCache = {};
function loadFrameImageAt(index) {
  const src = FRAMES[index].src;
  if (!src) return Promise.resolve(null);
  if (!frameImageCache[src]) {
    frameImageCache[src] = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }
  return frameImageCache[src];
}

function applySiteTheme(siteTheme) {
  if (siteTheme === 'classic') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', siteTheme);
  }
}

function applyConfig(cfg) {
  config = cfg;
  applySiteTheme(config.siteTheme);
  siteThemeSelect.value = config.siteTheme;
  captionInput.value = config.caption;
  boldInput.checked = config.bold;
  italicInput.checked = config.italic;
  showDateInput.checked = config.showDate;
  dateStyleField.style.display = config.showDate ? '' : 'none';
  renderCaptionPreview();
}

// Template sharing: the whole customization (theme + caption + date toggle) is
// packed into the URL hash as base64 JSON, so a link/QR code is fully static —
// no account, upload, or backend involved. Keep this payload small and simple
// (short strings/booleans only) so it stays scannable as a QR code.
function encodeConfig(cfg) {
  const json = JSON.stringify(cfg);
  return btoa(unescape(encodeURIComponent(json)));
}

function decodeConfig(str) {
  try {
    const json = decodeURIComponent(escape(atob(str)));
    const parsed = JSON.parse(json);
    return {
      siteTheme: SITE_THEMES.includes(parsed.siteTheme) ? parsed.siteTheme : 'classic',
      caption: typeof parsed.caption === 'string' ? parsed.caption.slice(0, 40) : 'Portabooth',
      bold: !!parsed.bold,
      italic: !!parsed.italic,
      showDate: !!parsed.showDate
    };
  } catch (e) {
    return null;
  }
}

function readConfigFromURL() {
  const match = location.hash.match(/^#c=(.+)$/);
  return match ? decodeConfig(match[1]) : null;
}

// Background music toggle — only offered on a shared/customized template
// link, per the request. Autoplay-with-sound is blocked by most browsers
// until the user interacts with the page, so the initial play() below will
// usually be silently rejected; the toggle's label tracks bgMusic's actual
// play/pause state (not the attempt), so it's always accurate regardless of
// whether autoplay succeeded.
// Default intent is set once `shared` is known, below (on for a shared
// template link, off for the plain main page). The toggle's label reflects
// this *intent*, not the audio element's live paused state — actual
// playback often can't start immediately (see below), and showing the
// intended state from the start avoids exposing autoplay-policy internals
// to the visitor.
let musicUserDisabled = true;

function updateMusicToggleLabel() {
  musicToggle.textContent = musicUserDisabled ? '🎵 Music: off' : '🎵 Music: on';
}

function applyMusicIntent() {
  if (musicUserDisabled) bgMusic.pause();
  else bgMusic.play().catch(() => {});
  updateMusicToggleLabel();
}

musicToggle.addEventListener('click', () => {
  musicUserDisabled = !musicUserDisabled;
  applyMusicIntent();
});

// Browsers block autoplay-with-sound until the visitor interacts with the
// page at all — not necessarily the music toggle itself. So start it on the
// first interaction of any kind (click, tap, keypress) elsewhere on the
// page. The toggle itself is excluded: it already handles its own click via
// applyMusicIntent() above, and pointerdown-before-click ordering would
// otherwise race with it (this handler starting playback, then the toggle's
// click handler immediately reversing it).
function tryStartMusicOnFirstInteraction(e) {
  if (e.target === musicToggle || musicToggle.contains(e.target)) return;
  document.removeEventListener('pointerdown', tryStartMusicOnFirstInteraction);
  document.removeEventListener('keydown', tryStartMusicOnFirstInteraction);
  if (!musicUserDisabled && bgMusic.paused) bgMusic.play().catch(() => {});
}
document.addEventListener('pointerdown', tryStartMusicOnFirstInteraction);
document.addEventListener('keydown', tryStartMusicOnFirstInteraction);

const shared = readConfigFromURL();
if (shared) {
  applyConfig(shared);
  templateNote.style.display = 'block';
  // Recipients of a shared template use it as-is — theme, caption, and style
  // are locked to whatever the creator set. Only the date format (not the
  // caption itself) stays adjustable, via #dateStyleField below.
  customizeDetails.style.display = 'none';
} else {
  applyConfig(config);
}

// Background music + its on/off toggle are available on every page, but
// default differently: on for a shared/customized template link (the
// creator's chosen vibe carries over), off for the plain main page. See
// applyMusicIntent() above for how actual playback catches up as soon as
// it's technically allowed once "on".
musicUserDisabled = !shared;
musicToggle.style.display = 'inline-block';
applyMusicIntent();

async function startCamera(mode) {
  const requested = mode;
  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: requested, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    // Only stop the old stream (and commit to the new facing mode) once the
    // new one has actually succeeded, so a failed switch leaves the current
    // camera running instead of leaving the user with a blank viewfinder.
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = newStream;
    facingMode = requested;
    video.srcObject = stream;
    video.classList.toggle('mirrored', facingMode === 'user');
    permHint.style.display = 'none';
    return true;
  } catch (err) {
    permHint.textContent = "Couldn't access the camera — check your browser's camera permission and try again.";
    return false;
  }
}

async function initCamera() {
  await startCamera(facingMode);
  // Only offer the flip button if the device actually has more than one
  // camera — most laptops only have a single front-facing webcam.
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameraCount = devices.filter(d => d.kind === 'videoinput').length;
    if (cameraCount > 1) flipCameraBtn.style.display = 'flex';
  } catch (err) { /* enumerateDevices unsupported — leave the button hidden */ }
}
initCamera();

flipCameraBtn.addEventListener('click', async () => {
  flipCameraBtn.disabled = true;
  await startCamera(facingMode === 'user' ? 'environment' : 'user');
  flipCameraBtn.disabled = false;
});

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runCountdown(seconds) {
  countdownEl.style.display = 'flex';
  for (let i = seconds; i > 0; i--) {
    countdownEl.textContent = i;
    await sleep(700);
  }
  countdownEl.style.display = 'none';
}

// Camera shutter click, synthesized via Web Audio so no external audio file
// needs to be vendored/licensed. A short burst of high-passed noise with a
// fast decay reads as a mechanical "click" rather than a synth blip.
const shutterAudio = new Audio('sounds/shutter.mp3');
shutterAudio.preload = 'auto';

function playShutterSound() {
  shutterAudio.currentTime = 0;
  shutterAudio.play().catch(() => {});
}

function doFlash() {
  playShutterSound();
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.9';
  // Force the browser to commit the "flash on" state above before queuing the
  // fade-out below — without this, a rAF-only restart can (inconsistently,
  // depending on paint timing) collapse both style changes into a single
  // paint and skip the flash frame entirely.
  void flashEl.offsetHeight;
  flashEl.style.transition = 'opacity 350ms ease';
  flashEl.style.opacity = '0';
}

function captureFrame() {
  const w = video.videoWidth, h = video.videoHeight;
  const c = document.createElement('canvas');
  c.width = FRAME_W;
  c.height = FRAME_H;
  const ctx = c.getContext('2d');

  // cover-fit crop from the live video, mirrored to match the preview —
  // only for the front camera; the back camera captures un-mirrored.
  const srcAspect = w / h, dstAspect = FRAME_W / FRAME_H;
  let sx, sy, sw, sh;
  if (srcAspect > dstAspect) {
    sh = h; sw = h * dstAspect; sx = (w - sw) / 2; sy = 0;
  } else {
    sw = w; sh = w / dstAspect; sx = 0; sy = (h - sh) / 2;
  }
  if (facingMode === 'user') {
    ctx.translate(FRAME_W, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, FRAME_W, FRAME_H);
  return c;
}

function captionFont(size) {
  const style = config.italic ? 'italic ' : '';
  const weight = config.bold ? 'bold ' : '';
  return `${style}${weight}${size}px Unna, Georgia, serif`;
}

function formatDate(date) {
  if (dateStyle === 'numeric') {
    const yy = String(date.getFullYear()).slice(-2);
    return `${date.getMonth() + 1}.${date.getDate()}.${yy}`;
  }
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

// Shared by renderAllFrames() (the real export, all frame slides) and
// renderCaptionPreview() (the live customize-panel preview) so the two can
// never drift out of sync.
function computeCaptionLayout() {
  const captionLine = config.caption.trim();
  const dateLine = (config.showDate && dateStyle !== 'off') ? formatDate(new Date()) : '';
  let captionH = 0;
  if (captionLine) captionH += CAPTION_FONT_SIZE;
  if (captionLine && dateLine) captionH += CAPTION_LINE_GAP;
  if (dateLine) captionH += DATE_FONT_SIZE;
  if (captionH) captionH += CAPTION_PAD * 2;
  // If there's a caption but no date, add back the vertical space a date
  // line would have taken (its gap + font size) as extra bottom padding
  // instead of just shrinking the strip — keeps the overall exported/print
  // size the same whether or not the date is shown, rather than surprising
  // someone with a shorter strip just for turning the date off.
  if (captionLine && !dateLine) captionH += CAPTION_LINE_GAP + DATE_FONT_SIZE;
  return { captionLine, dateLine, captionH };
}

async function loadCaptionFonts() {
  // Unna must actually be loaded before ctx.font can use it, or the canvas
  // silently falls back to the default serif font.
  await Promise.all([
    document.fonts.load(captionFont(CAPTION_FONT_SIZE)),
    document.fonts.load(captionFont(DATE_FONT_SIZE))
  ]);
}

function drawCaptionLines(ctx, centerX, top, layout) {
  if (!layout.captionH) return;
  ctx.fillStyle = STRIP_INK;
  ctx.textAlign = 'center';

  if (layout.captionLine && !layout.dateLine) {
    // Caption is the only content (no date): center it vertically in the
    // whole white-space band, using the canvas's own 'middle' baseline
    // rather than a hand-computed offset — robust regardless of font metrics.
    ctx.textBaseline = 'middle';
    ctx.font = captionFont(CAPTION_FONT_SIZE);
    ctx.fillText(layout.captionLine, centerX, top + layout.captionH / 2);
    return;
  }

  ctx.textBaseline = 'top';
  let y = top + CAPTION_PAD;
  if (layout.captionLine) {
    ctx.font = captionFont(CAPTION_FONT_SIZE);
    // Small nudge down so the caption sits visually balanced above the date
    // line beneath it — see ARCHITECTURE.md "Caption vertical offset".
    ctx.fillText(layout.captionLine, centerX, y + 4);
    y += CAPTION_FONT_SIZE + CAPTION_LINE_GAP;
  }
  if (layout.dateLine) {
    ctx.font = captionFont(DATE_FONT_SIZE);
    ctx.fillText(layout.dateLine, centerX, y);
  }
}

// Live preview shown in the customize panel, before any photos are taken.
// Renders the same caption/date band renderAllFrames() will produce, at the
// same pixel width, so it's an exact preview rather than an approximation.
async function renderCaptionPreview() {
  await loadCaptionFonts();
  const layout = computeCaptionLayout();
  const width = FRAME_W + PADDING * 2;
  const height = Math.max(layout.captionH, CAPTION_PAD * 2 + CAPTION_FONT_SIZE);
  captionPreview.width = width;
  captionPreview.height = height;
  const ctx = captionPreview.getContext('2d');
  ctx.fillStyle = STRIP_PAPER;
  ctx.fillRect(0, 0, width, height);
  drawCaptionLines(ctx, width / 2, 0, layout);
}

// Draws one strip's paper background, photos, caption, and (if set) the
// themed frame overlay, at the given x offset within ctx — no cut-guide
// border. Shared by renderAllFrames() (one call per frame slide) and
// buildPrintCanvas() (two strips side by side sharing one outer border and
// one dividing line, rather than each strip carrying its own).
function drawStripContent(ctx, offsetX, stripW, photosH, layout, frameImg) {
  const stripH = PADDING * 2 + photosH + layout.captionH;
  ctx.fillStyle = STRIP_PAPER;
  ctx.fillRect(offsetX, 0, stripW, stripH);

  // Each photo is drawn slightly smaller than its cell (PHOTO_SCALE, both
  // dimensions scaled equally so the diagonal shrinks by the same
  // percentage) and centered within it — a subtle paper-colored border
  // around each individual photo, distinct from the strip's own outer
  // margin/border.
  const drawW = FRAME_W * PHOTO_SCALE;
  const drawH = FRAME_H * PHOTO_SCALE;
  const cellInsetX = (FRAME_W - drawW) / 2;
  const cellInsetY = (FRAME_H - drawH) / 2;
  shots.forEach((shotCanvas, i) => {
    const cellY = PADDING + i * (FRAME_H + GAP);
    const cellX = offsetX + PADDING;
    const x = cellX + cellInsetX;
    const y = cellY + cellInsetY;
    ctx.drawImage(shotCanvas, x, y, drawW, drawH);
    applyPixelFilterMatrix(ctx, x, y, drawW, drawH, FILTER_MATRICES[photoFilter]);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, drawW, drawH);
  });

  // Drawn on top of the photos (not the caption yet), so its opaque
  // decorative art sits over the photo edges and its transparent cutouts
  // let the photos show through underneath. Scaled to exactly stripW x
  // stripH — an exact 1:1 match to the frame's own native size (560x1702,
  // see frames/engagement.png) whenever the caption+date band is at its
  // default full height; a shorter band (caption or date turned off — see
  // computeCaptionLayout()) stretches the frame slightly rather than
  // cropping or leaving a gap, since the frame is a single flat image, not
  // a 9-slice asset.
  if (frameImg) {
    ctx.drawImage(frameImg, offsetX, 0, stripW, stripH);
  }

  // Caption/date drawn LAST, on top of the frame — frames like
  // frames/engagement.png paint an opaque background over the whole caption
  // band (not just decorative accents), so if this were drawn underneath
  // the frame, the caption/date would be completely hidden behind it. Text
  // stays legible on top regardless of the frame's own background color.
  drawCaptionLines(ctx, offsetX + stripW / 2, PADDING + photosH, layout);
}

function stripDimensions() {
  const stripW = FRAME_W + PADDING * 2;
  const photosH = shots.length * FRAME_H + (shots.length - 1) * GAP;
  const layout = computeCaptionLayout();
  const stripH = PADDING * 2 + photosH + layout.captionH;
  return { stripW, photosH, stripH, layout };
}

// One <canvas> per FRAMES entry, laid out side by side in #stripScroller (a
// CSS scroll-snap carousel — see "Frame carousel" below) so swiping shows
// real, already-rendered previews of neighboring frames rather than blank
// placeholders. Built once at load; deliberately has NO cut-guide border on
// any slide — that only exists on the separate print-formatting canvas
// (buildPrintCanvas(), see "Print layout" below).
const frameCanvases = FRAMES.map(() => {
  const slide = document.createElement('div');
  slide.className = 'strip-slide';
  const canvas = document.createElement('canvas');
  slide.appendChild(canvas);
  stripScroller.appendChild(slide);
  return canvas;
});

// The canvas actually used for Save/Share (see saveBtn/shareBtn below) —
// whichever frame is currently centered in the carousel.
function activeCanvas() {
  return frameCanvases[frameIndex];
}

// Renders every frame's slide from the current shots/caption/filter state.
// Unlike a single active canvas, ALL slides need to reflect the current
// photos so the carousel shows accurate previews while swiping between
// them, not stale ones left over from a previous session or setting.
async function renderAllFrames() {
  await loadCaptionFonts();
  const { stripW, photosH, stripH, layout } = stripDimensions();
  await Promise.all(FRAMES.map(async (frame, i) => {
    const frameImg = await loadFrameImageAt(i);
    const canvas = frameCanvases[i];
    canvas.width = stripW;
    canvas.height = stripH;
    const ctx = canvas.getContext('2d');
    // The strip is always plain white/dark ink — kept the same regardless
    // of site theme so a printed strip looks like a real photobooth strip.
    drawStripContent(ctx, 0, stripW, photosH, layout, frameImg);
  }));
}

// Two copies of the strip side by side for printing, sharing ONE outer
// dashed border and ONE dashed line down the middle marking where to cut
// them apart — not each strip carrying its own full border, which would
// double up into two adjacent lines (plus each strip's own small margin
// inside its border) right where they meet.
async function buildPrintCanvas() {
  const [, frameImg] = await Promise.all([loadCaptionFonts(), loadFrameImageAt(frameIndex)]);
  const { stripW, photosH, stripH, layout } = stripDimensions();
  const inset = 5; // canvas edge -> dashed border line, unrelated to the margins below

  // Each strip's own photos/caption already sit centered within stripW (see
  // drawStripContent()/stripDimensions()) — PADDING on both sides. Without a
  // gutter here, the right strip's left edge (and the left strip's right
  // edge) would butt directly against the middle cut line with only that
  // bare PADDING between it and the photos, while the two outer edges get
  // PADDING *plus* PRINT_SIDE_MARGIN before reaching the dashed border. That
  // mismatch is what made each strip look off-center relative to the cut
  // line versus the sheet's outer edge. Inserting a gutter here — the same
  // width as twice the outer margin, split evenly by the dashed line —
  // gives the middle line the same PRINT_SIDE_MARGIN of breathing room on
  // each side that the outer border already gets, so every strip has equal
  // margin on both of its sides.
  const middleGutter = PRINT_SIDE_MARGIN * 2;

  const coreWidth = stripW * 2 + middleGutter;
  const coreHeight = stripH;
  const canvas = document.createElement('canvas');
  canvas.width = coreWidth + PRINT_SIDE_MARGIN * 2 + inset * 2;
  canvas.height = coreHeight + PRINT_TOP_MARGIN + PRINT_BOTTOM_MARGIN + inset * 2;
  const ctx = canvas.getContext('2d');

  // Fill the whole canvas first — drawStripContent() only paints its own
  // stripW-wide region, so without this the new margin areas added below
  // would be left transparent instead of matching paper white.
  ctx.fillStyle = STRIP_PAPER;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Shift the two-strip block so it sits exactly PRINT_TOP_MARGIN /
  // PRINT_SIDE_MARGIN away from the dashed border on those sides — a
  // translate() rather than passing more offsets into drawStripContent(),
  // so that shared function (also used by renderAllFrames(), unaffected by
  // any of this) doesn't need to know about print-specific margins at all.
  const coreOffsetX = inset + PRINT_SIDE_MARGIN;
  const coreOffsetY = inset + PRINT_TOP_MARGIN;
  ctx.save();
  ctx.translate(coreOffsetX, coreOffsetY);
  // PRINT_OUTWARD_NUDGE shifts each strip's whole block (paper + photos +
  // caption) toward its own outer edge — left strip left, right strip right
  // — independent of the equal-margins gutter above. The middle dashed line
  // below is NOT shifted by this; it stays centered in the gutter.
  drawStripContent(ctx, -PRINT_OUTWARD_NUDGE, stripW, photosH, layout, frameImg);
  drawStripContent(ctx, stripW + middleGutter + PRINT_OUTWARD_NUDGE, stripW, photosH, layout, frameImg);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = '#d0d0d0';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 5]);
  ctx.strokeRect(inset, inset, canvas.width - inset * 2, canvas.height - inset * 2);
  ctx.beginPath();
  const middleLineX = coreOffsetX + stripW + middleGutter / 2;
  ctx.moveTo(middleLineX, inset);
  ctx.lineTo(middleLineX, canvas.height - inset);
  ctx.stroke();
  ctx.restore();

  return canvas;
}

async function runSession() {
  // Unlock audio playback synchronously within this click (a real user
  // gesture) — iOS Safari in particular only allows the first play() to
  // succeed if it's called directly inside the gesture handler, not later
  // inside the async countdown/capture loop below (even one `await` away).
  // Muted, so this priming play/pause doesn't itself produce an audible
  // shutter click before any photo is actually taken — only doFlash() (the
  // real per-shot shutter sound, timed with the flash) should ever be heard.
  shutterAudio.muted = true;
  shutterAudio.play().then(() => {
    shutterAudio.pause();
    shutterAudio.currentTime = 0;
    shutterAudio.muted = false;
  }).catch(() => { shutterAudio.muted = false; });

  shots = [];
  startBtn.disabled = true;
  startBtn.style.display = 'none';
  retakeBtn.style.display = 'none';
  stripWrap.style.display = 'none';
  stage.style.display = 'block';

  for (let i = 1; i <= SHOT_COUNT; i++) {
    shotCounter.textContent = `${i} / ${SHOT_COUNT}`;
    await runCountdown(5);
    doFlash();
    await sleep(300);
    shots.push(captureFrame());
    shotCounter.textContent = `${i} / ${SHOT_COUNT}`;
    await sleep(834);
  }

  await renderAllFrames();
  stripWrap.style.display = 'flex';
  startBtn.disabled = false;
  startBtn.style.display = 'inline-block';
  startBtn.textContent = 'Take Photostrip';
}

startBtn.addEventListener('click', runSession);
againBtn.addEventListener('click', () => {
  stripWrap.style.display = 'none';
});

function downloadStripPng() {
  const link = document.createElement('a');
  link.download = `portabooth-${Date.now()}.png`;
  link.href = activeCanvas().toDataURL('image/png');
  link.click();
}

function isMobileDevice() {
  const ua = navigator.userAgent || '';
  if (/Android|iPhone|iPod|iPad/i.test(ua)) return true;
  // iPadOS 13+ reports itself as "Macintosh" in the UA string, but exposes
  // multi-touch unlike a real Mac.
  if (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return true;
  return false;
}

function canShareFiles() {
  // Several desktop browsers (e.g. macOS Chrome/Safari, tied into the OS
  // share sheet) also implement navigator.share/canShare — checking support
  // alone isn't enough to mean "this is a phone that needs Photos access".
  // Desktop/laptop should always just download to Files, like before.
  if (!isMobileDevice()) return false;
  if (!navigator.canShare) return false;
  try {
    return navigator.canShare({ files: [new File([''], 'test.png', { type: 'image/png' })] });
  } catch (e) {
    return false;
  }
}

saveBtn.addEventListener('click', () => {
  // A plain download link always lands in Files/Downloads on mobile, never
  // the Photos/Gallery app — there's no direct "save to Photos" API exposed
  // to web pages (privacy/security). The native share sheet (same mechanism
  // as shareBtn below) is the only cross-platform way to offer "Save
  // Image"/"Save to Photos" from a web page, so try that first where
  // supported, and only fall back to a plain download if sharing isn't
  // available or genuinely fails — not if the visitor just cancels the sheet.
  if (!canShareFiles()) {
    downloadStripPng();
    return;
  }
  activeCanvas().toBlob(async (blob) => {
    const file = new File([blob], `portabooth-${Date.now()}.png`, { type: 'image/png' });
    try {
      await navigator.share({ files: [file] });
    } catch (e) {
      if (e.name !== 'AbortError') downloadStripPng();
    }
  });
});

// "Print" is split by platform rather than using one universal mechanism:
// mobile shares a plain PNG (native photo-print pipeline, handles
// borderless printing well); desktop uses window.print() via @media print
// CSS (the browser's own print-to-PDF/driver path is literal about
// honoring @page { margin: 0 }, so this fills the page with no injected
// header/footer). See ARCHITECTURE.md "Print layout" for the fuller
// history of why this ended up split this way rather than one approach
// used everywhere.
function canvasToPngFile(canvas, filename) {
  return new Promise(resolve => {
    canvas.toBlob(blob => resolve(new File([blob], filename, { type: 'image/png' })), 'image/png');
  });
}

printBtn.addEventListener('click', async () => {
  const printCanvas = await buildPrintCanvas();

  if (canShareFiles()) {
    // Mobile: route through the native share sheet, the same mechanism as
    // shareBtn. Most share sheets (iOS, many Android ones) offer a "Print"
    // action directly for a shared image — this hits the OS's native
    // *photo*-print pipeline, not the "print this webpage" pipeline
    // window.print() uses, which handles borderless printing far more
    // gracefully (it's literally the pipeline these portable photo
    // printers are designed around). canShareFiles() already gates on
    // isMobileDevice(), so this only applies there, not on desktop
    // browsers that happen to also implement navigator.share.
    const file = await canvasToPngFile(printCanvas, `portabooth-${Date.now()}.png`);
    try {
      await navigator.share({ files: [file] });
    } catch (e) { /* user cancelled, or share failed — nothing more to do */ }
    return;
  }

  // Desktop (or mobile without share support): use the browser's own print
  // pipeline via @media print CSS — see that CSS block for why this is
  // desktop's path rather than the same share-sheet route as mobile.
  const dataUrl = printCanvas.toDataURL('image/png');
  printSheet.innerHTML = '';
  const img = document.createElement('img');
  img.src = dataUrl;
  printSheet.appendChild(img);
  // Setting img.src doesn't mean the image has actually decoded/painted yet
  // — calling window.print() immediately can capture the page before that
  // happens, showing a correctly-sized but empty box until the user cancels
  // and reprints. Wait for it to actually be ready first.
  await (img.decode ? img.decode().catch(() => {}) : new Promise(resolve => {
    if (img.complete) resolve();
    else { img.onload = resolve; img.onerror = resolve; }
  }));
  window.print();
});

// Actually detach the live camera stream during printing, not just hide the
// <video> via CSS — some mobile WebKit versions render a video element with
// an active stream through a separate hardware-compositing layer that can
// show through the print output as a solid-color block even when its
// ancestors are display:none. Reattaching afterprint resumes the same
// stream (no new getUserMedia prompt). beforeprint/afterprint fire whether
// the visitor actually prints or cancels the dialog. (In practice this
// desktop-only print path rarely has a live camera stream running by the
// time a strip exists, but it's cheap insurance.)
window.addEventListener('beforeprint', () => {
  if (video.srcObject) video.srcObject = null;
});
window.addEventListener('afterprint', () => {
  if (stream && !video.srcObject) {
    video.srcObject = stream;
    video.play().catch(() => {});
  }
});

if (navigator.canShare) {
  shareBtn.style.display = 'inline-block';
}
shareBtn.addEventListener('click', () => {
  activeCanvas().toBlob(async (blob) => {
    const file = new File([blob], 'portabooth.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'My Portabooth' });
      } catch (e) { /* user cancelled */ }
    }
  });
});

// Live-update the customize-panel preview (always) and an already-captured
// strip (if one exists), so everything reflects the current settings as the
// user types/toggles, with no extra "apply" step.
function onConfigFieldChange() {
  config = {
    siteTheme: siteThemeSelect.value,
    caption: captionInput.value,
    bold: boldInput.checked,
    italic: italicInput.checked,
    showDate: showDateInput.checked
  };
  applySiteTheme(config.siteTheme);
  dateStyleField.style.display = config.showDate ? '' : 'none';
  renderCaptionPreview();
  if (shots.length) renderAllFrames();
}
siteThemeSelect.addEventListener('change', onConfigFieldChange);
captionInput.addEventListener('input', onConfigFieldChange);
boldInput.addEventListener('change', onConfigFieldChange);
italicInput.addEventListener('change', onConfigFieldChange);
showDateInput.addEventListener('change', onConfigFieldChange);

// Date format is a free choice for whoever's using the page (creator or a
// shared-link recipient) — unlike caption/theme/style, it's not locked by a
// shared template.
dateStyleSelect.addEventListener('change', () => {
  dateStyle = dateStyleSelect.value;
  if (shots.length) renderAllFrames();
});

filterSelect.addEventListener('change', () => {
  photoFilter = filterSelect.value;
  if (shots.length) renderAllFrames();
});

// Frame carousel: #stripScroller is a CSS scroll-snap carousel (see
// style.css) holding one already-rendered slide per FRAMES entry (built in
// renderAllFrames() above), so swiping between them shows real previews of
// neighboring frames rather than blank placeholders — no re-render needed
// on navigation, only frameIndex/#frameName need to track whichever slide
// ends up centered.
function setActiveFrameIndex(index) {
  frameIndex = index;
  frameNameEl.textContent = FRAMES[frameIndex].label;
}

function scrollToFrame(index, behavior) {
  const slide = stripScroller.children[index];
  if (!slide) return;
  stripScroller.scrollTo({
    left: slide.offsetLeft - (stripScroller.clientWidth - slide.clientWidth) / 2,
    behavior,
  });
}

framePrevBtn.addEventListener('click', () => {
  scrollToFrame((frameIndex - 1 + FRAMES.length) % FRAMES.length, 'smooth');
});
frameNextBtn.addEventListener('click', () => {
  scrollToFrame((frameIndex + 1) % FRAMES.length, 'smooth');
});

// Whichever slide's center is closest to the scroller's own center is the
// "current" one — used both to sync frameIndex/#frameName after a swipe
// settles, and (via scrollToFrame() above) to know where to scroll to for
// arrow-button navigation.
function nearestFrameIndexToScroll() {
  const center = stripScroller.scrollLeft + stripScroller.clientWidth / 2;
  let nearest = 0;
  let nearestDist = Infinity;
  Array.from(stripScroller.children).forEach((slide, i) => {
    const dist = Math.abs((slide.offsetLeft + slide.clientWidth / 2) - center);
    if (dist < nearestDist) { nearestDist = dist; nearest = i; }
  });
  return nearest;
}

// Fires once a swipe/scroll (from touch, trackpad, or the arrow buttons'
// scrollTo()) comes to rest, so frameIndex/#frameName — and therefore
// Save/Share/Print, which read activeCanvas()/frameIndex — always reflect
// whatever's actually centered on screen, not just direct arrow clicks.
// 'scrollend' (Chrome/Firefox/Safari 18+) fires exactly once per gesture;
// where it's unsupported (older Safari), fall back to a debounced 'scroll'
// listener that waits for scrolling to stop.
function onScrollSettled() {
  const index = nearestFrameIndexToScroll();
  if (index !== frameIndex) setActiveFrameIndex(index);
}
if ('onscrollend' in window) {
  stripScroller.addEventListener('scrollend', onScrollSettled);
} else {
  let scrollSettleTimer;
  stripScroller.addEventListener('scroll', () => {
    clearTimeout(scrollSettleTimer);
    scrollSettleTimer = setTimeout(onScrollSettled, 120);
  });
}

// qrcodejs (vendored in qrcode.min.js) uses a fixed QR "type" (matrix size) per
// call and throws if the payload doesn't fit — grow the type until it fits
// instead of hardcoding a size big enough for the worst case.
function renderQRCode(container, text) {
  container.innerHTML = '';
  for (let type = 1; type <= 40; type++) {
    try {
      new QRCode(container, { text, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.L, typeNumber: type });
      return;
    } catch (e) {
      container.innerHTML = '';
    }
  }
}

getLinkBtn.addEventListener('click', () => {
  const hash = '#c=' + encodeConfig(config);
  const url = location.origin + location.pathname + hash;
  shareLinkInput.value = url;
  shareOutput.style.display = 'flex';
  renderQRCode(qrOutput, url);
  history.replaceState(null, '', hash);
});

copyLinkBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(shareLinkInput.value);
  } catch (e) {
    shareLinkInput.select();
    document.execCommand('copy');
  }
  copyLinkBtn.textContent = 'Copied!';
  setTimeout(() => { copyLinkBtn.textContent = 'Copy'; }, 1500);
});
</script>
</body>
</html>
