<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snapstrip</title>
<style>
  :root {
    --curtain: #2b1518;
    --curtain-dark: #1a0d0f;
    --bulb: #ffd76a;
    --bulb-glow: #ffb347;
    --paper: #f5efe3;
    --ink: #241412;
    --brass: #b9863f;
    --brass-dark: #8a611f;
  }

  :root[data-theme="noir"] {
    --curtain: #141414;
    --curtain-dark: #000000;
    --bulb: #f2f2f2;
    --bulb-glow: #cfcfcf;
    --paper: #ffffff;
    --ink: #141414;
    --brass: #8a8a8a;
    --brass-dark: #4d4d4d;
  }

  :root[data-theme="blush"] {
    --curtain: #4a1f2b;
    --curtain-dark: #2e1019;
    --bulb: #ffd1dc;
    --bulb-glow: #ff9eb5;
    --paper: #fff5f7;
    --ink: #5c1a2e;
    --brass: #d68fa1;
    --brass-dark: #a85c73;
  }

  :root[data-theme="mint"] {
    --curtain: #123c34;
    --curtain-dark: #0a2620;
    --bulb: #d7fff0;
    --bulb-glow: #8fe9c9;
    --paper: #f2fbf7;
    --ink: #123c34;
    --brass: #6fbfa0;
    --brass-dark: #3f8a6d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse at top, #3a1c20 0%, var(--curtain) 45%, var(--curtain-dark) 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    color: var(--paper);
  }

  body {
    padding: 24px 16px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* velvet curtain texture stripes */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(0,0,0,0.12) 0px,
      rgba(0,0,0,0.12) 14px,
      rgba(255,255,255,0.02) 14px,
      rgba(255,255,255,0.02) 28px
    );
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  header h1 {
    font-family: 'Georgia', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: 0.5px;
    color: var(--bulb);
    text-shadow: 0 0 18px rgba(255, 183, 71, 0.45);
  }

  header p {
    margin: 6px 0 0;
    font-size: 0.85rem;
    color: #d8c3ae;
    font-style: italic;
  }

  .template-note {
    position: relative;
    z-index: 1;
    font-size: 0.75rem;
    font-style: italic;
    color: var(--bulb);
    text-align: center;
    margin: -12px 0 0;
  }

  .customize {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, #3d2226, #241315);
    border: 2px solid var(--brass-dark);
    border-radius: 6px;
    padding: 4px 16px 16px;
    color: var(--paper);
  }

  .customize summary {
    cursor: pointer;
    padding: 12px 0;
    font-family: 'Georgia', serif;
    font-style: italic;
    color: var(--bulb);
    list-style: none;
  }

  .customize summary::-webkit-details-marker { display: none; }
  .customize summary::before { content: "✦ "; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }

  .field select,
  .field input[type="text"] {
    width: 100%;
    font-family: 'Georgia', serif;
    font-size: 0.9rem;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid var(--brass);
    background: var(--paper);
    color: var(--ink);
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    margin-bottom: 14px;
  }

  .share-output {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed rgba(255,183,71,0.3);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .link-row {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .link-row input {
    flex: 1;
    min-width: 0;
    font-size: 0.8rem;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid var(--brass);
    background: var(--paper);
    color: var(--ink);
  }

  #qrOutput {
    background: #fff;
    padding: 10px;
    border-radius: 4px;
    line-height: 0;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    border-radius: 6px;
    padding: 14px;
    background: linear-gradient(180deg, #3d2226, #241315);
    border: 3px solid var(--brass-dark);
    box-shadow:
      0 0 0 1px rgba(185, 134, 63, 0.3),
      inset 0 0 30px rgba(0,0,0,0.55),
      0 20px 40px rgba(0,0,0,0.5);
  }

  .viewfinder {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(185,134,63,0.5);
  }

  video, .capture-canvas-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1); /* mirror like a real photobooth */
  }

  .countdown-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    font-weight: bold;
    color: var(--bulb);
    text-shadow: 0 0 30px rgba(255,183,71,0.8);
    background: rgba(0,0,0,0.15);
    font-family: 'Georgia', serif;
  }

  .flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
  }

  .shot-counter {
    position: absolute;
    top: 8px;
    right: 10px;
    background: rgba(0,0,0,0.55);
    color: var(--bulb);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    letter-spacing: 1px;
    border: 1px solid rgba(185,134,63,0.6);
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
  }

  button {
    font-family: 'Georgia', serif;
    font-style: italic;
    font-size: 0.95rem;
    padding: 10px 22px;
    border-radius: 30px;
    border: 1px solid var(--brass);
    background: linear-gradient(180deg, #c99a53, var(--brass-dark));
    color: #2a1608;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
    transition: transform 0.08s ease;
  }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.35);
  }

  button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  button.ghost {
    background: transparent;
    color: var(--bulb);
    border: 1px solid rgba(255,183,71,0.5);
    box-shadow: none;
  }

  .strip-wrap {
    position: relative;
    z-index: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 420px;
  }

  .strip-frame {
    background: var(--paper);
    padding: 14px;
    border-radius: 2px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.08);
  }

  #stripCanvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 1px;
  }

  .save-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .hint {
    font-size: 0.75rem;
    color: #c9ac8f;
    text-align: center;
    max-width: 320px;
    z-index: 1;
  }

  @media print {
    body * { visibility: hidden; }
    .strip-frame, .strip-frame * { visibility: visible; }
    .strip-frame {
      position: fixed;
      top: 0;
      left: 0;
      box-shadow: none;
      border: none;
    }
  }
</style>
</head>
<body>

  <header>
    <h1>Snapstrip</h1>
    <p>four frames, one strip, all yours</p>
  </header>

  <p class="template-note" id="templateNote" style="display:none;">Using a shared custom template</p>

  <details class="customize" id="customize">
    <summary>Customize your strip</summary>

    <div class="field">
      <label for="themeSelect">Frame theme</label>
      <select id="themeSelect">
        <option value="classic">Classic</option>
        <option value="noir">Noir</option>
        <option value="blush">Blush</option>
        <option value="mint">Mint</option>
      </select>
    </div>

    <div class="field">
      <label for="captionInput">Caption</label>
      <input type="text" id="captionInput" maxlength="40" value="Snapstrip">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="showDateInput" checked>
      Show date on strip
    </label>

    <button id="getLinkBtn" type="button">Get shareable link</button>

    <div class="share-output" id="shareOutput">
      <div class="link-row">
        <input type="text" id="shareLink" readonly>
        <button id="copyLinkBtn" class="ghost" type="button">Copy</button>
      </div>
      <div id="qrOutput"></div>
    </div>
  </details>

  <div class="stage" id="stage">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div class="flash" id="flash"></div>
      <div class="countdown-overlay" id="countdown"></div>
      <div class="shot-counter" id="shotCounter">0 / 4</div>
    </div>
    <div class="controls">
      <button id="startBtn">Start the strip</button>
      <button id="retakeBtn" class="ghost" style="display:none;">Start over</button>
    </div>
  </div>

  <p class="hint" id="permHint">Tap "Start the strip" and allow camera access. Everything happens on your device — nothing is uploaded anywhere.</p>

  <div class="strip-wrap" id="stripWrap">
    <div class="strip-frame">
      <canvas id="stripCanvas"></canvas>
    </div>
    <div class="save-row">
      <button id="saveBtn">Save to device</button>
      <button id="shareBtn" class="ghost" style="display:none;">Share</button>
      <button id="printBtn" class="ghost">Print</button>
      <button id="againBtn" class="ghost">New strip</button>
    </div>
  </div>

  <canvas id="workCanvas" style="display:none;"></canvas>

<script src="qrcode.min.js"></script>
<script>
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const retakeBtn = document.getElementById('retakeBtn');
const countdownEl = document.getElementById('countdown');
const flashEl = document.getElementById('flash');
const shotCounter = document.getElementById('shotCounter');
const stage = document.getElementById('stage');
const stripWrap = document.getElementById('stripWrap');
const stripCanvas = document.getElementById('stripCanvas');
const workCanvas = document.getElementById('workCanvas');
const permHint = document.getElementById('permHint');
const saveBtn = document.getElementById('saveBtn');
const shareBtn = document.getElementById('shareBtn');
const printBtn = document.getElementById('printBtn');
const againBtn = document.getElementById('againBtn');

const themeSelect = document.getElementById('themeSelect');
const captionInput = document.getElementById('captionInput');
const showDateInput = document.getElementById('showDateInput');
const getLinkBtn = document.getElementById('getLinkBtn');
const shareOutput = document.getElementById('shareOutput');
const shareLinkInput = document.getElementById('shareLink');
const copyLinkBtn = document.getElementById('copyLinkBtn');
const qrOutput = document.getElementById('qrOutput');
const templateNote = document.getElementById('templateNote');

const SHOT_COUNT = 4;
const FRAME_W = 500;   // px per photo cell at capture resolution
const FRAME_H = 375;   // 4:3
const PADDING = 20;
const GAP = 14;
const CAPTION_H = 46;  // reserved canvas height for the caption/date line

const THEMES = ['classic', 'noir', 'blush', 'mint'];

let stream = null;
let shots = [];
let config = { theme: 'classic', caption: 'Snapstrip', showDate: true };

function applyTheme(theme) {
  if (theme === 'classic') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
}

function applyConfig(cfg) {
  config = cfg;
  applyTheme(config.theme);
  themeSelect.value = config.theme;
  captionInput.value = config.caption;
  showDateInput.checked = config.showDate;
}

// Template sharing: the whole customization (theme + caption + date toggle) is
// packed into the URL hash as base64 JSON, so a link/QR code is fully static —
// no account, upload, or backend involved. Keep this payload small and simple
// (short strings/booleans only) so it stays scannable as a QR code.
function encodeConfig(cfg) {
  const json = JSON.stringify(cfg);
  return btoa(unescape(encodeURIComponent(json)));
}

function decodeConfig(str) {
  try {
    const json = decodeURIComponent(escape(atob(str)));
    const parsed = JSON.parse(json);
    return {
      theme: THEMES.includes(parsed.theme) ? parsed.theme : 'classic',
      caption: typeof parsed.caption === 'string' ? parsed.caption.slice(0, 40) : 'Snapstrip',
      showDate: !!parsed.showDate
    };
  } catch (e) {
    return null;
  }
}

function readConfigFromURL() {
  const match = location.hash.match(/^#c=(.+)$/);
  return match ? decodeConfig(match[1]) : null;
}

const shared = readConfigFromURL();
if (shared) {
  applyConfig(shared);
  templateNote.style.display = 'block';
} else {
  applyConfig(config);
}

async function initCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    video.srcObject = stream;
    permHint.style.display = 'none';
  } catch (err) {
    permHint.textContent = "Couldn't access the camera — check your browser's camera permission and try again.";
  }
}
initCamera();

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runCountdown(seconds) {
  countdownEl.style.display = 'flex';
  for (let i = seconds; i > 0; i--) {
    countdownEl.textContent = i;
    await sleep(700);
  }
  countdownEl.style.display = 'none';
}

function doFlash() {
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.9';
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity 350ms ease';
    flashEl.style.opacity = '0';
  });
}

function captureFrame() {
  const w = video.videoWidth, h = video.videoHeight;
  const c = document.createElement('canvas');
  c.width = FRAME_W;
  c.height = FRAME_H;
  const ctx = c.getContext('2d');

  // cover-fit crop from the live video, mirrored to match the preview
  const srcAspect = w / h, dstAspect = FRAME_W / FRAME_H;
  let sx, sy, sw, sh;
  if (srcAspect > dstAspect) {
    sh = h; sw = h * dstAspect; sx = (w - sw) / 2; sy = 0;
  } else {
    sw = w; sh = w / dstAspect; sx = 0; sy = (h - sh) / 2;
  }
  ctx.translate(FRAME_W, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, FRAME_W, FRAME_H);
  return c;
}

function buildStrip() {
  const styles = getComputedStyle(document.documentElement);
  const paperColor = styles.getPropertyValue('--paper').trim();
  const inkColor = styles.getPropertyValue('--ink').trim();

  const now = new Date();
  const dateStr = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const captionText = [config.caption.trim(), config.showDate ? dateStr : ''].filter(Boolean).join(' · ');
  const captionH = captionText ? CAPTION_H : 0;

  const stripW = FRAME_W + PADDING * 2;
  const photosH = shots.length * FRAME_H + (shots.length - 1) * GAP;
  const stripH = PADDING * 2 + photosH + captionH;
  stripCanvas.width = stripW;
  stripCanvas.height = stripH;
  const ctx = stripCanvas.getContext('2d');

  ctx.fillStyle = paperColor;
  ctx.fillRect(0, 0, stripW, stripH);

  shots.forEach((shotCanvas, i) => {
    const y = PADDING + i * (FRAME_H + GAP);
    ctx.drawImage(shotCanvas, PADDING, y, FRAME_W, FRAME_H);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    ctx.strokeRect(PADDING, y, FRAME_W, FRAME_H);
  });

  if (captionText) {
    ctx.fillStyle = inkColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "28px 'Brush Script MT', cursive, Georgia, serif";
    ctx.fillText(captionText, stripW / 2, PADDING + photosH + captionH / 2);
  }
}

async function runSession() {
  shots = [];
  startBtn.disabled = true;
  startBtn.style.display = 'none';
  retakeBtn.style.display = 'none';
  stripWrap.style.display = 'none';
  stage.style.display = 'block';

  for (let i = 0; i < SHOT_COUNT; i++) {
    shotCounter.textContent = `${i} / ${SHOT_COUNT}`;
    await runCountdown(3);
    doFlash();
    await sleep(120);
    shots.push(captureFrame());
    shotCounter.textContent = `${i + 1} / ${SHOT_COUNT}`;
    await sleep(500);
  }

  buildStrip();
  stripWrap.style.display = 'flex';
  startBtn.disabled = false;
  startBtn.style.display = 'inline-block';
  startBtn.textContent = 'Start the strip';
}

startBtn.addEventListener('click', runSession);
againBtn.addEventListener('click', () => {
  stripWrap.style.display = 'none';
});

saveBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `snapstrip-${Date.now()}.png`;
  link.href = stripCanvas.toDataURL('image/png');
  link.click();
});

printBtn.addEventListener('click', () => {
  window.print();
});

if (navigator.canShare) {
  shareBtn.style.display = 'inline-block';
}
shareBtn.addEventListener('click', () => {
  stripCanvas.toBlob(async (blob) => {
    const file = new File([blob], 'snapstrip.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'My Snapstrip' });
      } catch (e) { /* user cancelled */ }
    }
  });
});

// Live-update an already-captured strip if the customize fields change afterward,
// so Save/Share/Print always reflect the current theme/caption/date settings.
function onConfigFieldChange() {
  config = {
    theme: themeSelect.value,
    caption: captionInput.value,
    showDate: showDateInput.checked
  };
  applyTheme(config.theme);
  if (shots.length) buildStrip();
}
themeSelect.addEventListener('change', onConfigFieldChange);
captionInput.addEventListener('input', onConfigFieldChange);
showDateInput.addEventListener('change', onConfigFieldChange);

// qrcodejs (vendored in qrcode.min.js) uses a fixed QR "type" (matrix size) per
// call and throws if the payload doesn't fit — grow the type until it fits
// instead of hardcoding a size big enough for the worst case.
function renderQRCode(container, text) {
  container.innerHTML = '';
  for (let type = 1; type <= 40; type++) {
    try {
      new QRCode(container, { text, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.L, typeNumber: type });
      return;
    } catch (e) {
      container.innerHTML = '';
    }
  }
}

getLinkBtn.addEventListener('click', () => {
  const hash = '#c=' + encodeConfig(config);
  const url = location.origin + location.pathname + hash;
  shareLinkInput.value = url;
  shareOutput.style.display = 'flex';
  renderQRCode(qrOutput, url);
  history.replaceState(null, '', hash);
});

copyLinkBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(shareLinkInput.value);
  } catch (e) {
    shareLinkInput.select();
    document.execCommand('copy');
  }
  copyLinkBtn.textContent = 'Copied!';
  setTimeout(() => { copyLinkBtn.textContent = 'Copy'; }, 1500);
});
</script>
</body>
</html>
